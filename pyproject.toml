[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relaypulse"
version = "0.1.0"
description = "Resilient webhook delivery engine with HMAC-SHA256 signatures, exponential backoff, circuit breaking, and dead-letter queue replay"
readme = "README.md"
authors = [
    { name = "Hakan Ates", email = "163651512+Hakantes@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["webhook", "retry-engine", "dead-letter-queue", "circuit-breaker", "saas-operations", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking"
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
relaypulse = "relaypulse.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
